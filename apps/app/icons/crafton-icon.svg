		</filter>
		<clipPath id="tile">
			<rect x="46" y="46" width="932" height="932" rx="206" />
		</clipPath>
	</defs>
	<rect x="32" y="32" width="960" height="960" rx="220" fill="#22d3ee" />
	<rect x="46" y="46" width="932" height="932" rx="206" fill="url(#bg)" />
