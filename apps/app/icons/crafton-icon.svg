<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#0d1c27" />
			<stop offset="1" stop-color="#081118" />
		</linearGradient>
		<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#e6fdff" stop-opacity="0" />
			<stop offset="0.35" stop-color="#e6fdff" stop-opacity="0.9" />
			<stop offset="1" stop-color="#ffffff" />
		</linearGradient>
		<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#22d3ee" stop-opacity="0" />
			<stop offset="1" stop-color="#22d3ee" stop-opacity="0.55" />
		</linearGradient>
		<linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#7ef0fb" />
			<stop offset="1" stop-color="#2cc9c0" />
		</linearGradient>
		<filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
