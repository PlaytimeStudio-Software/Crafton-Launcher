			<rect x="790" y="508" width="36" height="36" />
		</g>
		<polygon points="512,560 788,698 512,836 236,698" fill="#22d3ee" opacity="0.5" filter="url(#blur)" />
		<polygon points="236,698 512,836 512,910 236,772" fill="#0e9fb3" />
		<polygon points="788,698 512,836 512,910 788,772" fill="#0a6c84" />
